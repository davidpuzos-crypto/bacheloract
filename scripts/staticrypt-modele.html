<!doctype html>
<html lang="fr" class="staticrypt-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Correction · Séance 9 · La fabrique du social</title>
<meta name="robots" content="noindex">
<meta http-equiv="cache-control" content="max-age=0">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<script src="../assets/js/theme.js"></script>
<style>
  .verrou { max-width: 34rem; margin: 0 auto; padding: 72px 24px 96px; }
  .verrou form { margin-top: 1.4rem; display: grid; gap: 14px; }
  .verrou label { font-family: var(--police-ui); font-weight: 700; }
  .verrou .ligne-mdp { display: flex; gap: 8px; }
  .verrou .ligne-mdp input { flex: 1; }
  .verrou .souvenir { display: flex; gap: 10px; align-items: center; font-weight: 600; }
  .verrou .souvenir input { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); }
  .verrou .erreur { color: var(--erreur); font-family: var(--police-ui); font-weight: 700; min-height: 1.4em; margin: 0; }
  .hidden { display: none !important; }
</style>
</head>
<body class="staticrypt-body">
<header class="entete-statique"><a href="index.html">La fabrique du social, séance 9</a></header>
<div id="staticrypt_loading" class="verrou"><p class="meta">Ouverture de la correction…</p></div>
<main id="staticrypt_content" class="verrou hidden">
  <p class="etiquette">Quête 3 · Lire · Correction</p>
  <h1>La correction</h1>
  <p class="chapeau">Entrez le mot de passe donné en séance.</p>
  <form id="staticrypt-form" action="#" method="post">
    <label for="staticrypt-password">Mot de passe</label>
    <div class="ligne-mdp">
      <input id="staticrypt-password" type="password" name="password" autocomplete="off" required>
      <button type="button" class="btn discret petit" id="voir-mdp" aria-pressed="false">Afficher</button>
    </div>
    <label id="staticrypt-remember-label" class="souvenir hidden"><input id="staticrypt-remember" type="checkbox" name="remember" checked> Se souvenir du mot de passe sur cet ordinateur</label>
    <p class="erreur" id="erreur-mdp" role="alert"></p>
    <p><button type="submit" class="btn">Ouvrir la correction</button></p>
  </form>
  <p class="meta">Le mot de passe est annoncé par l’enseignant à la fin du dépôt. En attendant, <a href="6-lire.html#depot">revenez au dépôt</a> ou <a href="index.html">à l’accueil de la séance</a>.</p>
</main>
<script>
  const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
  const templateError = "/*[|template_error|]*/0",
    isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
    staticryptConfig = /*[|staticrypt_config|]*/ 0;
  const templateConfig = {
    rememberExpirationKey: "fabrique_s09_correction_expiration",
    rememberPassphraseKey: "fabrique_s09_correction_cle",
    replaceHtmlCallback: function (html) { document.open(); document.write(html); document.close(); },
    clearLocalStorageCallback: null
  };
  const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);
  window.onload = async function () {
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
    if (!isSuccessful) {
      document.getElementById("staticrypt_loading").classList.add("hidden");
      document.getElementById("staticrypt_content").classList.remove("hidden");
      if (isRememberEnabled) { document.getElementById("staticrypt-remember-label").classList.remove("hidden"); }
      document.getElementById("staticrypt-password").focus();
    }
  };
  document.getElementById("voir-mdp").addEventListener("click", function () {
    const champ = document.getElementById("staticrypt-password");
    const visible = champ.type === "text";
    champ.type = visible ? "password" : "text";
    this.textContent = visible ? "Afficher" : "Masquer";
    this.setAttribute("aria-pressed", visible ? "false" : "true");
  });
  document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const erreur = document.getElementById("erreur-mdp");
    erreur.textContent = "";
    const mdp = document.getElementById("staticrypt-password").value.trim();
    const souvenir = document.getElementById("staticrypt-remember").checked;
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(mdp, souvenir);
    if (!isSuccessful) {
      erreur.textContent = templateError;
      document.getElementById("staticrypt-password").select();
    }
  });
</script>
</body>
</html>
