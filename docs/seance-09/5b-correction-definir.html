      document.getElementById("staticrypt-password").focus();
    }
  };
  document.getElementById("voir-mdp").addEventListener("click", function () {
    const champ = document.getElementById("staticrypt-password");
    const visible = champ.type === "text";
    champ.type = visible ? "password" : "text";
    this.textContent = visible ? "Afficher" : "Masquer";
    this.setAttribute("aria-pressed", visible ? "false" : "true");
  });
  document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const erreur = document.getElementById("erreur-mdp");
    erreur.textContent = "";
    const mdp = document.getElementById("staticrypt-password").value.trim();
    const souvenir = document.getElementById("staticrypt-remember").checked;
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(mdp, souvenir);
    if (!isSuccessful) {
      erreur.textContent = templateError;
      document.getElementById("staticrypt-password").select();
    }
  });
</script>
</body>
</html>
